spring:
  application:
    name: academic-professor-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/academic_professor}
    username: ${SPRING_DATASOURCE_USERNAME:school}
    password: ${SPRING_DATASOURCE_PASSWORD:school_local}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8093}

management:
  endpoints:
    web:
      exposure:
        include: health,info

professor:
  internal-api:
    token: ${ACADEMIC_PROFESSOR_INTERNAL_API_TOKEN:}
  people-service:
    base-url: ${PROFESSOR_PEOPLE_SERVICE_BASE_URL:http://localhost:8083}
    internal-token: ${PROFESSOR_PEOPLE_SERVICE_INTERNAL_TOKEN:people-local-token}
    connect-timeout: ${PROFESSOR_PEOPLE_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROFESSOR_PEOPLE_SERVICE_READ_TIMEOUT:5s}
  catalog-service:
    base-url: ${PROFESSOR_CATALOG_SERVICE_BASE_URL:http://localhost:8082}
    internal-token: ${PROFESSOR_CATALOG_SERVICE_INTERNAL_TOKEN:catalog-local-token}
    connect-timeout: ${PROFESSOR_CATALOG_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROFESSOR_CATALOG_SERVICE_READ_TIMEOUT:5s}
