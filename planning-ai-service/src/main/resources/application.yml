spring:
  application:
    name: planning-ai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/planning_ai}
    username: ${SPRING_DATASOURCE_USERNAME:school}
    password: ${SPRING_DATASOURCE_PASSWORD:school_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8096

planning-ai:
  internal-api:
    token: ${PLANNING_AI_INTERNAL_TOKEN:}
  persistence:
    backfill:
      enabled: ${PLANNING_AI_BACKFILL_ENABLED:false}
      source-url: ${PLANNING_AI_BACKFILL_SOURCE_URL:}
      source-username: ${PLANNING_AI_BACKFILL_SOURCE_USERNAME:}
      source-password: ${PLANNING_AI_BACKFILL_SOURCE_PASSWORD:}
      batch-size: ${PLANNING_AI_BACKFILL_BATCH_SIZE:500}
      fail-on-mismatch: ${PLANNING_AI_BACKFILL_FAIL_ON_MISMATCH:true}
