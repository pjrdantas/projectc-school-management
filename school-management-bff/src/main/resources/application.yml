spring:
  application:
    name: school-management-bff
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: ${SERVER_PORT:8081}

clients:
  catalog-service:
    base-url: ${CATALOG_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout: ${CATALOG_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${CATALOG_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${CATALOG_INTERNAL_API_TOKEN:}
  people-service:
    base-url: ${PEOPLE_SERVICE_BASE_URL:http://localhost:8083}
    connect-timeout: ${PEOPLE_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${PEOPLE_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${PEOPLE_INTERNAL_API_TOKEN:}
  responsibles-service:
    base-url: ${RESPONSIBLES_SERVICE_BASE_URL:http://localhost:8098}
    connect-timeout: ${RESPONSIBLES_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${RESPONSIBLES_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${RESPONSIBLES_INTERNAL_API_TOKEN:}
  academic-professor-service:
    base-url: ${ACADEMIC_PROFESSOR_SERVICE_BASE_URL:http://localhost:8093}
    connect-timeout: ${ACADEMIC_PROFESSOR_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${ACADEMIC_PROFESSOR_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${ACADEMIC_PROFESSOR_INTERNAL_API_TOKEN:}
  identity-access-service:
    base-url: ${IDENTITY_ACCESS_SERVICE_BASE_URL:http://localhost:8091}
    connect-timeout: ${IDENTITY_ACCESS_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${IDENTITY_ACCESS_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${IDENTITY_ACCESS_INTERNAL_API_TOKEN:}
  institutional-tenant-service:
    base-url: ${INSTITUTIONAL_TENANT_SERVICE_BASE_URL:http://localhost:8092}
    connect-timeout: ${INSTITUTIONAL_TENANT_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${INSTITUTIONAL_TENANT_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${INSTITUTIONAL_TENANT_INTERNAL_API_TOKEN:}
  dashboard-query-service:
    base-url: ${DASHBOARD_QUERY_SERVICE_BASE_URL:http://localhost:8097}
    connect-timeout: ${DASHBOARD_QUERY_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${DASHBOARD_QUERY_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${DASHBOARD_QUERY_INTERNAL_API_TOKEN:}
  enrollment-document-service:
    base-url: ${ENROLLMENT_DOCUMENT_SERVICE_BASE_URL:http://localhost:8094}
    connect-timeout: ${ENROLLMENT_DOCUMENT_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${ENROLLMENT_DOCUMENT_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${ENROLLMENT_DOCUMENT_INTERNAL_API_TOKEN:}
  pedagogical-service:
    base-url: ${PEDAGOGICAL_SERVICE_BASE_URL:http://localhost:8095}
    connect-timeout: ${PEDAGOGICAL_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${PEDAGOGICAL_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${PEDAGOGICAL_INTERNAL_API_TOKEN:}
  planning-ai-service:
    base-url: ${PLANNING_AI_SERVICE_BASE_URL:http://localhost:8096}
    connect-timeout: ${PLANNING_AI_SERVICE_CONNECT_TIMEOUT:2s}
    response-timeout: ${PLANNING_AI_SERVICE_RESPONSE_TIMEOUT:3s}
    internal-token: ${PLANNING_AI_INTERNAL_API_TOKEN:}

features:
  disciplinas-proxy-enabled: ${DISCIPLINAS_PROXY_ENABLED:true}
  catalog-read-proxy-enabled: ${CATALOG_READ_PROXY_ENABLED:${DISCIPLINAS_PROXY_ENABLED:true}}
  catalog-write-proxy-enabled: ${CATALOG_WRITE_PROXY_ENABLED:true}
  people-read-proxy-enabled: ${PEOPLE_READ_PROXY_ENABLED:true}
  responsibles-read-proxy-enabled: ${RESPONSIBLES_READ_PROXY_ENABLED:true}
  identity-access-read-proxy-enabled: ${IDENTITY_ACCESS_READ_PROXY_ENABLED:true}
  institutional-tenant-read-proxy-enabled: ${INSTITUTIONAL_TENANT_READ_PROXY_ENABLED:true}
  dashboard-read-proxy-enabled: ${DASHBOARD_READ_PROXY_ENABLED:true}
  enrollment-document-read-proxy-enabled: ${ENROLLMENT_DOCUMENT_READ_PROXY_ENABLED:true}
  enrollment-document-write-proxy-enabled: ${ENROLLMENT_DOCUMENT_WRITE_PROXY_ENABLED:true}
  pedagogical-read-proxy-enabled: ${PEDAGOGICAL_READ_PROXY_ENABLED:true}
  pedagogical-write-proxy-enabled: ${PEDAGOGICAL_WRITE_PROXY_ENABLED:true}
  planning-ai-read-proxy-enabled: ${PLANNING_AI_READ_PROXY_ENABLED:true}
  planning-ai-write-proxy-enabled: ${PLANNING_AI_WRITE_PROXY_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
