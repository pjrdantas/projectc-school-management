spring:
  application:
    name: responsibles-service

server:
  port: ${SERVER_PORT:8098}

responsibles:
  internal-api:
    token: ${RESPONSIBLES_INTERNAL_TOKEN:}
  read-model:
    enabled: ${RESPONSIBLES_READ_MODEL_ENABLED:true}
    migration-enabled: ${RESPONSIBLES_READ_MODEL_MIGRATION_ENABLED:true}
    local-read-routing-enabled: ${RESPONSIBLES_LOCAL_READ_ROUTING_ENABLED:true}
    backfill-enabled: false
    reconciliation-enabled: false
    backfill-batch-size: ${RESPONSIBLES_READ_MODEL_BACKFILL_BATCH_SIZE:500}
    fail-on-error: ${RESPONSIBLES_READ_MODEL_FAIL_ON_ERROR:true}
    fallback-enabled: false
    schema-migration:
      url: ${RESPONSIBLES_READ_MODEL_DB_URL:jdbc:postgresql://localhost:5433/responsibles}
      username: ${RESPONSIBLES_READ_MODEL_DB_USERNAME:school}
      password: ${RESPONSIBLES_READ_MODEL_DB_PASSWORD:school_local}
      driver-class-name: ${RESPONSIBLES_READ_MODEL_DB_DRIVER:org.postgresql.Driver}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
