spring:
  application:
    name: responsibles-service

server:
  port: ${SERVER_PORT:8098}

responsibles:
  internal-api:
    token: ${RESPONSIBLES_INTERNAL_TOKEN:}
  monolith:
    base-url: ${RESPONSIBLES_MONOLITH_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
