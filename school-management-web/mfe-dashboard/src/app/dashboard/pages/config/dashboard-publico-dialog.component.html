<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form class="dialog-grid" [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Código *</mat-label>
      <input matInput formControlName="codigo" maxlength="40" placeholder="PROFESSOR" />
      <mat-error *ngIf="form.controls.codigo.hasError('required')">Código é obrigatório.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Descrição *</mat-label>
      <input matInput formControlName="descricao" maxlength="120" placeholder="Professor" />
      <mat-error *ngIf="form.controls.descricao.hasError('required')">Descrição é obrigatória.</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">Salvar</button>
</mat-dialog-actions>
