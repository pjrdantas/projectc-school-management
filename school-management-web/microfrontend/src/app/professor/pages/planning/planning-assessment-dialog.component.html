<h2 mat-dialog-title>Nova avaliação prevista</h2>

<mat-dialog-content>
  <form class="dialog-grid" [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Título *</mat-label>
      <input matInput formControlName="titulo" maxlength="180" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo *</mat-label>
      <select matNativeControl formControlName="tipoAvaliacao">
        <option *ngFor="let option of typeOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Data prevista</mat-label>
      <input matInput type="date" formControlName="dataPrevista" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Peso *</mat-label>
      <input matInput type="number" min="0.01" step="0.01" formControlName="peso" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Valor máximo</mat-label>
      <input matInput type="number" min="0.01" step="0.01" formControlName="valorMaximo" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Descrição</mat-label>
      <textarea matInput rows="3" formControlName="descricao"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Conteúdo cobrado</mat-label>
      <textarea matInput rows="3" formControlName="conteudoCobrado"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Orientação de aplicação</mat-label>
      <textarea matInput rows="3" formControlName="orientacaoAplicacao"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">Salvar</button>
</mat-dialog-actions>
