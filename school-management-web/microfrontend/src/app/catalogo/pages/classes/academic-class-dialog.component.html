<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form class="dialog-grid" [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Turma *</mat-label>
      <input matInput formControlName="nome" placeholder="Turma A" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Capacidade *</mat-label>
      <input matInput type="number" formControlName="capacidade" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Período letivo *</mat-label>
      <input
        matInput
        formControlName="periodoLetivoNome"
        [matAutocomplete]="autoPeriodo"
        (input)="onPeriodInput(($any($event.target).value || '').toString())"
        placeholder="Primeiro semestre"
      />
      <mat-autocomplete
        #autoPeriodo="matAutocomplete"
        (optionSelected)="onPeriodOptionSelected($event.option.value)"
      >
        <mat-option *ngFor="let period of filteredPeriods()" [value]="period.id">
          {{ period.nome }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Série *</mat-label>
      <mat-select formControlName="serieId">
        <mat-option *ngFor="let serie of data.series" [value]="serie.id">
          {{ serie.nome }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Turno *</mat-label>
      <mat-select formControlName="turno">
        <mat-option *ngFor="let turno of data.shifts" [value]="turno.codigo">
          {{ turno.descricao }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status *</mat-label>
      <mat-select formControlName="status">
        <mat-option value="ATIVA">Ativa</mat-option>
        <mat-option value="INATIVA">Inativa</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">
    Salvar
  </button>
</mat-dialog-actions>
