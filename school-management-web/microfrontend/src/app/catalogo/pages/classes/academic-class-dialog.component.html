<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form class="dialog-grid" [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Turma *</mat-label>
      <input matInput formControlName="nome" placeholder="Turma A" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Capacidade *</mat-label>
      <input matInput type="number" formControlName="capacidade" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Período letivo *</mat-label>
      <select matNativeControl formControlName="periodoLetivoId">
        <option value="">Selecione</option>
        <option *ngFor="let period of periodOptions" [value]="period.id">
          {{ period.nome }}
        </option>
      </select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Série *</mat-label>
      <select matNativeControl formControlName="serieId">
        <option value="">Selecione</option>
        <option *ngFor="let serie of seriesOptions" [value]="serie.id">
          {{ serie.nome }}
        </option>
      </select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Turno *</mat-label>
      <select matNativeControl formControlName="turno">
        <option value="">Selecione</option>
        <option *ngFor="let turno of shiftOptions" [value]="turno.codigo">
          {{ turno.descricao }}
        </option>
      </select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status *</mat-label>
      <select matNativeControl formControlName="status">
        <option *ngFor="let status of statusOptions" [value]="status.value">
          {{ status.label }}
        </option>
      </select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">
    Salvar
  </button>
</mat-dialog-actions>
