<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form class="dialog-grid" [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Código *</mat-label>
      <input matInput formControlName="codigo" placeholder="MANHA" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Turno *</mat-label>
      <input matInput formControlName="descricao" placeholder="Manhã" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">Salvar</button>
</mat-dialog-actions>
