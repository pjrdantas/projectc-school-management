<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form class="dialog-grid" [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Modelo oficial</mat-label>
      <select
        matNativeControl
        formControlName="modeloOficial"
        (change)="applyOfficialWidget($any($event.target).value)"
      >
        <option value="">Código livre</option>
        <option *ngFor="let widget of officialWidgetOptions" [value]="widget.codigo">
          {{ widget.ordem }} - {{ widget.titulo }} ({{ widget.codigo }})
        </option>
      </select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Código *</mat-label>
      <input matInput formControlName="codigo" maxlength="80" placeholder="AULAS_REALIZADAS" />
      <mat-error *ngIf="form.controls.codigo.hasError('required')">Código é obrigatório.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status *</mat-label>
      <select matNativeControl formControlName="ativo">
        <option *ngFor="let status of statusOptions" [value]="status.value">
          {{ status.label }}
        </option>
      </select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Título *</mat-label>
      <input matInput formControlName="titulo" maxlength="150" />
      <mat-error *ngIf="form.controls.titulo.hasError('required')">Título é obrigatório.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo *</mat-label>
      <select matNativeControl formControlName="tipoWidget">
        <option *ngFor="let type of typeOptions" [value]="type">
          {{ type }}
        </option>
      </select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ordem *</mat-label>
      <input matInput type="number" min="0" formControlName="ordem" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Referência</mat-label>
      <input matInput formControlName="queryReferencia" maxlength="150" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Descrição</mat-label>
      <textarea matInput rows="3" formControlName="descricao"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">Salvar</button>
</mat-dialog-actions>
