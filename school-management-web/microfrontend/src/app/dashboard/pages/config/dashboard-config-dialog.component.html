<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form class="dialog-grid" [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Público *</mat-label>
      <select matNativeControl formControlName="publicoDashboardId">
        <option value="">Selecione</option>
        <option *ngFor="let publico of data.publicos" [value]="publico.id">
          {{ publico.descricao }} ({{ publico.codigo }})
        </option>
      </select>
      <mat-error *ngIf="form.controls.publicoDashboardId.hasError('required')">Público é obrigatório.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status *</mat-label>
      <select matNativeControl formControlName="ativo">
        <option *ngFor="let status of statusOptions" [value]="status.value">
          {{ status.label }}
        </option>
      </select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Código *</mat-label>
      <input matInput formControlName="codigo" maxlength="80" placeholder="DASH_PROFESSOR" />
      <mat-error *ngIf="form.controls.codigo.hasError('required')">Código é obrigatório.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nome *</mat-label>
      <input matInput formControlName="nome" maxlength="150" placeholder="Dashboard do Professor" />
      <mat-error *ngIf="form.controls.nome.hasError('required')">Nome é obrigatório.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Descrição</mat-label>
      <textarea matInput rows="3" formControlName="descricao"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">Salvar</button>
</mat-dialog-actions>
