<div class="page-container">
  <mat-card class="federated-card">
    <mat-card-content>
      <div class="header-row">
        <h1>Períodos letivos</h1>
        <button mat-raised-button color="primary" type="button" (click)="openCreateDialog()" [disabled]="isLoading()">
          <mat-icon fontIcon="add"></mat-icon>
          Novo período letivo
        </button>
      </div>

      <form class="search-row" [formGroup]="searchForm" (ngSubmit)="onSearchByName()">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Consultar por nome do período letivo *</mat-label>
          <input
            matInput
            formControlName="nome"
            [matAutocomplete]="periodAuto"
            (input)="onPeriodSearchInput(($any($event.target).value || '').toString())"
            placeholder="Digite o nome do período"
          />
          <mat-error *ngIf="searchForm.controls.nome.hasError('required')"
            >Informe um nome.</mat-error
          >
        </mat-form-field>

        <mat-autocomplete
          #periodAuto="matAutocomplete"
          [displayWith]="displayPeriod"
          (optionSelected)="onPeriodOptionSelected($event.option.value)"
        >
          <mat-option *ngFor="let period of filteredPeriods()" [value]="period.id">
            {{ period.nome }}
          </mat-option>
        </mat-autocomplete>

        <button mat-stroked-button type="submit" [disabled]="isLoading()">
          <mat-icon fontIcon="search"></mat-icon>
          Buscar
        </button>
      </form>

      <div class="empty-state" *ngIf="total() === 0">Nenhum período carregado ainda.</div>

      <div class="list" *ngIf="total() > 0">
        <div class="list-item" *ngFor="let period of pagedPeriods()">
          <div>
            <h3>{{ period.nome }}</h3>
            <div class="period-dates">
              <p><strong>Início:</strong> {{ formatDate(period.dataInicio) }}</p>
              <p><strong>Fim:</strong> {{ formatDate(period.dataFim) }}</p>
            </div>
          </div>

          <div class="actions-row">
            <button mat-stroked-button type="button" (click)="onEdit(period.id)">Editar</button>
            <button mat-stroked-button color="warn" type="button" (click)="onDelete(period.id)">
              Excluir
            </button>
          </div>
        </div>

        <mat-paginator
          *ngIf="total() > 5"
          [length]="total()"
          [pageIndex]="pageIndex()"
          [pageSize]="pageSize()"
          [pageSizeOptions]="pageSizeOptions"
          [hidePageSize]="true"
          showFirstLastButtons
          (page)="onPageChange($event)"
        ></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
