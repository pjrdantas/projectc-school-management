<mat-card><mat-card-content><h1>CRUD de Perfis</h1><form [formGroup]="form" (ngSubmit)="salvar()"><input matInput placeholder="Código" formControlName="codigo"><input matInput placeholder="Nome" formControlName="nome"><input matInput placeholder="Descrição" formControlName="descricao"><button mat-raised-button color="primary" type="submit">Salvar</button></form><ul><li *ngFor="let p of perfis">{{p.codigo}} - {{p.nome}}</li></ul></mat-card-content></mat-card>
