<mat-card><mat-card-content><h1>Perfis</h1><button mat-raised-button color="primary" (click)="novo()">Novo perfil</button><ul><li *ngFor="let p of perfis">{{p.codigo}} - {{p.nome}} <button mat-button [routerLink]="['/auth/profiles',p.id]">Detalhar</button><button mat-button [routerLink]="['/auth/profiles',p.id,'edit']">Editar</button><button mat-button color="warn" (click)="excluir(p.id)">Excluir</button></li></ul></mat-card-content></mat-card>
