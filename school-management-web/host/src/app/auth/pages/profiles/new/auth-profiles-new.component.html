<div class="page-container"><mat-card class="student-card"><mat-card-header><mat-card-title>{{id()?'Edição de Perfil':'Cadastro de Perfil'}}</mat-card-title><mat-card-subtitle>Cadastro de perfil integrado ao backend</mat-card-subtitle></mat-card-header><mat-card-content><form class="student-form" [formGroup]="form" (ngSubmit)="salvar()"><mat-form-field appearance="outline"><mat-label>Código *</mat-label><input matInput formControlName="codigo"></mat-form-field><mat-form-field appearance="outline"><mat-label>Nome *</mat-label><input matInput formControlName="nome"></mat-form-field><mat-form-field appearance="outline"><mat-label>Descrição</mat-label><input matInput formControlName="descricao"></mat-form-field><mat-form-field appearance="outline"><mat-label>Permissões</mat-label><mat-select formControlName="permissaoIds" multiple><mat-option *ngFor="let p of permissions" [value]="p.id">{{p.codigo}}</mat-option></mat-select></mat-form-field><div class="actions"><button mat-raised-button color="primary" type="submit"><mat-icon fontIcon="save"></mat-icon>Salvar</button><button mat-stroked-button type="button" (click)="onCancel()"><mat-icon fontIcon="close"></mat-icon>Cancelar</button></div></form></mat-card-content></mat-card></div>
