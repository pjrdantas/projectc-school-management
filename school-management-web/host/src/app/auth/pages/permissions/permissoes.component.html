<div class="page-container">
  <mat-card class="student-card">
    <mat-card-header>
      <mat-card-title>Gestão de Permissões</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="actions">
        <button mat-raised-button color="primary" (click)="openDialogCreate()">
          <mat-icon>add</mat-icon>
          Nova Permissão
        </button>
      </div>

      <div class="list">
        <div class="item" *ngFor="let p of permissoes">
          <div>
            <strong>{{ p.codigo }}</strong>
            <p>{{ p.descricao || '-' }}</p>
          </div>
          <div>
            <button mat-button (click)="openDialogDetails(p)">Consultar</button>
            <button mat-button [disabled]="isAdmin(p.codigo)" (click)="openDialogEdit(p)">Editar</button>
            <button mat-button color="warn" [disabled]="isAdmin(p.codigo)" (click)="delete(p.id)">Excluir</button>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
