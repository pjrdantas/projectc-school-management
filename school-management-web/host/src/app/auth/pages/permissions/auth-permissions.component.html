<mat-card><mat-card-content><h1>CRUD de Permissões</h1><form [formGroup]="form" (ngSubmit)="salvar()"><input matInput placeholder="Código" formControlName="codigo"><input matInput placeholder="Descrição" formControlName="descricao"><button mat-raised-button color="primary" type="submit">Salvar</button></form><ul><li *ngFor="let p of permissoes">{{p.codigo}} - {{p.descricao}}</li></ul></mat-card-content></mat-card>
