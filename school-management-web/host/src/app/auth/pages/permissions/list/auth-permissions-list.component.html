<mat-card><mat-card-content><h1>Permissões</h1><button mat-raised-button color="primary" (click)="novo()">Nova permissão</button><ul><li *ngFor="let p of permissoes">{{p.codigo}} - {{p.descricao}} <button mat-button [routerLink]="['/auth/permissions',p.id]">Detalhar</button><button mat-button [routerLink]="['/auth/permissions',p.id,'edit']">Editar</button><button mat-button color="warn" (click)="excluir(p.id)">Excluir</button></li></ul></mat-card-content></mat-card>
