<h2 mat-dialog-title>Detalhes da Permissão</h2>
<mat-dialog-content>
  <p><strong>Código:</strong> {{ data.codigo }}</p>
  <p><strong>Descrição:</strong> {{ data.descricao || '-' }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Fechar</button>
</mat-dialog-actions>
