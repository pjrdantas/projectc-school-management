<div class="page-container"><mat-card class="student-card"><mat-card-header><mat-card-title>{{userId() ? 'Editar Usuário' : 'Novo Usuário'}}</mat-card-title></mat-card-header><mat-card-content><form class="student-form" [formGroup]="form" (ngSubmit)="salvar()"><mat-form-field appearance="outline"><mat-label>Nome Completo</mat-label><input matInput formControlName="nome"/></mat-form-field><mat-form-field appearance="outline"><mat-label>Login</mat-label><input matInput formControlName="username"/></mat-form-field><mat-form-field appearance="outline"><mat-label>E-mail</mat-label><input matInput type="email" formControlName="email"/></mat-form-field><mat-form-field appearance="outline"><mat-label>Senha</mat-label><input matInput type="password" formControlName="senhaHash"/></mat-form-field><mat-form-field appearance="outline"><mat-label>Perfis do Usuário</mat-label><mat-select formControlName="perfilIds" multiple><mat-option *ngFor="let p of profiles" [value]="p.id">{{p.nome}}</mat-option></mat-select></mat-form-field><mat-slide-toggle formControlName="ativo">Usuário Ativo</mat-slide-toggle><div class="actions"><button mat-raised-button color="primary" type="submit"><mat-icon>check_circle</mat-icon>Salvar</button><button mat-button type="button" (click)="onCancel()"><mat-icon>cancel</mat-icon>Cancelar</button></div></form></mat-card-content></mat-card></div>
