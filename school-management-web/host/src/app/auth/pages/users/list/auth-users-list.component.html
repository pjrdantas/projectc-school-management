<div class="page-container"><mat-card class="student-card"><mat-card-header><mat-card-title>Usuários</mat-card-title></mat-card-header><mat-card-content><div class="actions"><button mat-raised-button color="primary" (click)="novo()"><mat-icon fontIcon="add"></mat-icon>Novo usuário</button></div><div class="list"><div class="item" *ngFor="let u of usuarios"><div><strong>{{u.nome}}</strong><p>{{u.email}}</p></div><div><button mat-button (click)="detalhe(u.id)">Consultar</button><button mat-button (click)="editar(u.id)">Editar</button><button mat-button color="warn" (click)="excluir(u.id)">Excluir</button></div></div></div></mat-card-content></mat-card></div>
