<mat-card><mat-card-content><h1>Usuários</h1><button mat-raised-button color="primary" (click)="novo()">Novo usuário</button><ul><li *ngFor="let u of usuarios"><b>{{u.nome}}</b> - {{u.email}} <button mat-button [routerLink]="['/auth/users',u.id]">Detalhar</button><button mat-button [routerLink]="['/auth/users',u.id,'edit']">Editar</button><button mat-button color="warn" (click)="excluir(u.id)">Excluir</button></li></ul></mat-card-content></mat-card>
