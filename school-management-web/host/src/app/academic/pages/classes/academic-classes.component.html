<div class="page-container">
  <mat-card class="federated-card">
    <mat-card-content>
      <div class="header-row"><h1>Turmas</h1></div>

      <form class="form-grid" [formGroup]="form" (ngSubmit)="onCreateOrUpdate()">
        <mat-form-field appearance="outline">
          <mat-label>Código *</mat-label>
          <input matInput formControlName="codigo" placeholder="TURMA-A" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Nome *</mat-label>
          <input matInput formControlName="nome" placeholder="Turma A" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Capacidade *</mat-label>
          <input matInput type="number" formControlName="capacidade" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Período letivo *</mat-label>
          <input matInput formControlName="periodoNome" [matAutocomplete]="autoPeriodo" (input)="onPeriodInput(($any($event.target).value || '').toString())" placeholder="Digite o nome do período" />
          <mat-autocomplete #autoPeriodo="matAutocomplete" (optionSelected)="onPeriodOptionSelected($event.option.value)">
            <mat-option *ngFor="let period of filteredPeriods()" [value]="period.id">{{ period.nome }}</mat-option>
          </mat-autocomplete>
        </mat-form-field>

        <div class="actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="isLoading()">{{ editingClassId() ? 'Atualizar turma' : 'Salvar turma' }}</button>
          <button mat-stroked-button type="button" *ngIf="editingClassId()" (click)="clearForm()">Cancelar edição</button>
        </div>
      </form>

      <form class="search-row" [formGroup]="searchForm" (ngSubmit)="onSearchByName()">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Consultar por nome da turma *</mat-label>
          <input matInput formControlName="nome" [matAutocomplete]="autoClass" (input)="onClassSearchInput(($any($event.target).value || '').toString())" placeholder="Digite o nome da turma" />
        </mat-form-field>
        <mat-autocomplete #autoClass="matAutocomplete" (optionSelected)="onClassOptionSelected($event.option.value)">
          <mat-option *ngFor="let turma of filteredClasses()" [value]="turma.id">{{ turma.nome }}</mat-option>
        </mat-autocomplete>
        <button mat-stroked-button type="submit" [disabled]="isLoading()"><mat-icon fontIcon="search"></mat-icon>Buscar</button>
      </form>

      <div class="empty-state" *ngIf="total() === 0">Nenhuma turma carregada ainda.</div>
      <div class="list" *ngIf="total() > 0">
        <div class="list-item" *ngFor="let turma of classes$ | async">
          <div>
            <h3>{{ turma.codigo }} - {{ turma.nome }}</h3>
            <p><strong>ID:</strong> {{ turma.id }}</p>
            <p><strong>Período:</strong> {{ getPeriodName(turma.periodoLetivoId) }}</p>
            <p><strong>Capacidade:</strong> {{ turma.capacidade }}</p>
          </div>
          <div class="actions">
            <button mat-button type="button" (click)="onEdit(turma.id)">Editar</button>
            <button mat-button color="warn" type="button" (click)="onDelete(turma.id)">Excluir</button>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
