<div class="page-container">
  <mat-card class="federated-card">
    <mat-card-content>
      <div class="header-row">
        <h1>Turnos</h1>
        <button mat-raised-button color="primary" type="button" (click)="openCreateDialog()" [disabled]="isLoading()">
          <mat-icon fontIcon="add"></mat-icon>
          Novo turno
        </button>
      </div>

      <form class="search-row" [formGroup]="searchForm" (ngSubmit)="onSearchByDescription()">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Consultar por turno *</mat-label>
          <input
            matInput
            formControlName="descricao"
            [matAutocomplete]="autoShifts"
            (input)="onShiftSearchInput(($any($event.target).value || '').toString())"
            placeholder="Digite o turno ou código"
          />
        </mat-form-field>
        <mat-autocomplete
          #autoShifts="matAutocomplete"
          (optionSelected)="onShiftOptionSelected($event.option.value)"
        >
          <mat-option *ngFor="let turno of filteredShifts()" [value]="turno.id">
            {{ turno.descricao }} - {{ turno.codigo }}
          </mat-option>
        </mat-autocomplete>
        <button mat-stroked-button type="submit" [disabled]="isLoading()">
          <mat-icon fontIcon="search"></mat-icon>Buscar
        </button>
      </form>

      <div class="empty-state" *ngIf="total() === 0">Nenhum turno carregado ainda.</div>
      <div class="list" *ngIf="total() > 0">
        <div class="list-item" *ngFor="let turno of pagedShifts()">
          <div>
            <h3>Turno: {{ turno.descricao }}</h3>
            <p><strong>Código:</strong> {{ turno.codigo }}</p>
          </div>
          <div class="actions-row">
            <button mat-stroked-button type="button" (click)="onEdit(turno.id)">Editar</button>
            <button mat-stroked-button color="warn" type="button" (click)="onDelete(turno.id)">
              Excluir
            </button>
          </div>
        </div>

        <mat-paginator
          *ngIf="total() > 5"
          [length]="total()"
          [pageIndex]="pageIndex()"
          [pageSize]="pageSize()"
          [pageSizeOptions]="pageSizeOptions"
          [hidePageSize]="true"
          showFirstLastButtons
          (page)="onPageChange($event)"
        ></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
