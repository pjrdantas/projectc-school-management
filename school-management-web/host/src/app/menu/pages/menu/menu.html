<mat-toolbar class="toolbar-gradient">
  <div class="toolbar-left">
    <button
      mat-icon-button
      [matMenuTriggerFor]="menu"
      matTooltip="Menu"
      aria-label="Menu"
    >
      <mat-icon fontIcon="menu"></mat-icon>
    </button>

    <span class="data-hora">
      {{ dataHoraFormatada }}
    </span>
  </div>

  <div class="toolbar-center">
    <span class="titulo-toolbar">Sistema de Gestão Escolar</span>
  </div>

  <div class="toolbar-right" *ngIf="authState.usuario$ | async as usuario">
    <mat-icon fontIcon="person"></mat-icon>
    <span class="usuario-logado-text">{{ usuario.nome }}</span>
  </div>
</mat-toolbar>

<mat-divider></mat-divider>

<mat-menu #menu="matMenu" panelClass="custom-colored-menu">

 <button mat-menu-item (click)="irHome()">
    <mat-icon fontIcon="home"></mat-icon>
    <span class="item-menu">Home</span>
  </button>

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="irStudents()">
    <mat-icon fontIcon="person"></mat-icon>
    <span class="item-menu">Alunos</span>
  </button>

  <button mat-menu-item (click)="irResponsibles()">
    <mat-icon fontIcon="family_restroom"></mat-icon>
    <span class="item-menu">Responsáveis</span>
  </button>

  <button mat-menu-item (click)="irAcademicPeriods()">
    <mat-icon fontIcon="date_range"></mat-icon>
    <span class="item-menu">Períodos letivos</span>
  </button>

  <button mat-menu-item (click)="irAcademicSeries()">
    <mat-icon fontIcon="format_list_numbered"></mat-icon>
    <span class="item-menu">Séries</span>
  </button>

  <button mat-menu-item (click)="irAcademicShifts()">
    <mat-icon fontIcon="schedule"></mat-icon>
    <span class="item-menu">Turnos</span>
  </button>

  <button mat-menu-item (click)="irAcademicClasses()">
    <mat-icon fontIcon="class"></mat-icon>
    <span class="item-menu">Turmas</span>
  </button>

  <button mat-menu-item (click)="irAcademicDisciplines()">
    <mat-icon fontIcon="menu_book"></mat-icon>
    <span class="item-menu">Disciplinas</span>
  </button>

  <button mat-menu-item (click)="irEnrollment()">
    <mat-icon fontIcon="assignment"></mat-icon>
    <span class="item-menu">Matrícula</span>
  </button>

  <button mat-menu-item [matMenuTriggerFor]="accessMenu">
    <mat-icon fontIcon="admin_panel_settings"></mat-icon>
    <span class="item-menu">Acesso</span>
  </button>

  <mat-menu #accessMenu="matMenu">
    <button mat-menu-item (click)="irUsuarios()">
      <mat-icon fontIcon="group"></mat-icon>
      <span class="item-menu">Usuários</span>
    </button>
    <button mat-menu-item (click)="irPerfis()">
      <mat-icon fontIcon="badge"></mat-icon>
      <span class="item-menu">Perfis</span>
    </button>
    <button mat-menu-item (click)="irPermissoes()">
      <mat-icon fontIcon="verified_user"></mat-icon>
      <span class="item-menu">Permissões</span>
    </button>
  </mat-menu>

  <button mat-menu-item (click)="irMicrofrontend()">
    <mat-icon fontIcon="widgets"></mat-icon>
    <span class="item-menu">Microfrontend</span>
  </button>

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="sair()">
    <mat-icon fontIcon="logout"></mat-icon>
    <span class="item-menu">Sair</span>
  </button>
</mat-menu>

<div class="content-container">
  <router-outlet></router-outlet>
</div>
