<div class="page-container">
  <mat-card class="federated-card">
    <mat-card-content>
      <div class="header-row">
        <h1>Séries</h1>
        <button mat-raised-button color="primary" type="button" (click)="openCreateDialog()" [disabled]="isLoading()">
          <mat-icon fontIcon="add"></mat-icon>
          Nova série
        </button>
      </div>

      <form class="search-row" [formGroup]="searchForm" (ngSubmit)="onSearchByName()">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Consultar por nome da série *</mat-label>
          <input
            matInput
            formControlName="nome"
            [matAutocomplete]="autoSeries"
            (input)="onSeriesSearchInput(($any($event.target).value || '').toString())"
            placeholder="Digite o nome da série"
          />
        </mat-form-field>
        <mat-autocomplete
          #autoSeries="matAutocomplete"
          (optionSelected)="onSeriesOptionSelected($event.option.value)"
        >
          <mat-option *ngFor="let serie of filteredSeries()" [value]="serie.id">
            {{ serie.nome }}
          </mat-option>
        </mat-autocomplete>
        <button mat-stroked-button type="submit" [disabled]="isLoading()">
          <mat-icon fontIcon="search"></mat-icon>Buscar
        </button>
      </form>

      <div class="empty-state" *ngIf="total() === 0">Nenhuma série carregada ainda.</div>
      <div class="list" *ngIf="total() > 0">
        <div class="list-item" *ngFor="let serie of pagedSeries()">
          <div>
            <h3>Série: {{ serie.nome }}</h3>
            <p><strong>Ordem:</strong> {{ serie.ordem }}</p>
            <p><strong>Nível de ensino:</strong> {{ serie.nivelEnsino || '-' }}</p>
          </div>
          <div class="actions-row">
            <button mat-stroked-button type="button" (click)="onEdit(serie.id)">Editar</button>
            <button mat-stroked-button color="warn" type="button" (click)="onDelete(serie.id)">
              Excluir
            </button>
          </div>
        </div>

        <mat-paginator
          *ngIf="total() > 5"
          [length]="total()"
          [pageIndex]="pageIndex()"
          [pageSize]="pageSize()"
          [pageSizeOptions]="pageSizeOptions"
          [hidePageSize]="true"
          showFirstLastButtons
          (page)="onPageChange($event)"
        ></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
