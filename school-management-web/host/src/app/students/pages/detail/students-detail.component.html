<div class="page-container" *ngIf="student() as aluno">
  <mat-card class="detail-card">
    <mat-card-header>
      <mat-card-title>Consulta de Aluno</mat-card-title>
      <mat-card-subtitle>{{ aluno.nomeCompleto }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p><strong>CPF:</strong> {{ formatCpf(aluno.cpf) }}</p>
      <p><strong>E-mail:</strong> {{ aluno.email }}</p>
      <p><strong>Data de nascimento:</strong> {{ formatData(aluno.dataNascimento) }}</p>
      <p><strong>Telefone:</strong> {{ aluno.telefone || 'Não informado' }}</p>
      <p><strong>Cadastrado em:</strong> {{ aluno.createdAt | date: 'dd/MM/yyyy HH:mm' }}</p>

      <div class="actions">
        <button mat-stroked-button [routerLink]="['/students', aluno.id, 'edit']">Editar</button>
        <button mat-raised-button color="primary" routerLink="/students">Voltar</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
