<div class="page-container" *ngIf="responsible() as item">
  <mat-card class="detail-card">
    <mat-card-header>
      <mat-card-title>Consulta de Responsável</mat-card-title>
      <mat-card-subtitle><strong>{{ item.nomeCompleto }}</strong></mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p><strong>CPF:</strong> {{ formatCpf(item.cpf) }}</p>
      <p><strong>E-mail:</strong> {{ item.email || 'Não informado' }}</p>
      <p><strong>Telefone:</strong> {{ item.telefone || 'Não informado' }}</p>
      <p><strong>Cadastrado em:</strong> {{ item.createdAt | date: 'dd/MM/yyyy HH:mm' }}</p>

      <div class="actions">
        <button mat-raised-button color="primary" routerLink="/responsibles">Voltar</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
