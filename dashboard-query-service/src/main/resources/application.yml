spring:
  application:
    name: dashboard-query-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/dashboard_query}
    username: ${SPRING_DATASOURCE_USERNAME:school}
    password: ${SPRING_DATASOURCE_PASSWORD:school_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8097

dashboard-query:
  internal-api:
    token: ${DASHBOARD_QUERY_INTERNAL_TOKEN:}
  persistence:
    backfill:
      enabled: ${DASHBOARD_QUERY_BACKFILL_ENABLED:false}
      source-url: ${DASHBOARD_QUERY_BACKFILL_SOURCE_URL:}
      source-username: ${DASHBOARD_QUERY_BACKFILL_SOURCE_USERNAME:}
      source-password: ${DASHBOARD_QUERY_BACKFILL_SOURCE_PASSWORD:}
      escola-id: ${DASHBOARD_QUERY_BACKFILL_ESCOLA_ID:}
      batch-size: ${DASHBOARD_QUERY_BACKFILL_BATCH_SIZE:500}
      fail-on-mismatch: ${DASHBOARD_QUERY_BACKFILL_FAIL_ON_MISMATCH:true}
