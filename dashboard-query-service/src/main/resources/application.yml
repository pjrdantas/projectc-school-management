spring:
  application:
    name: dashboard-query-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/dashboard_query}
    username: ${SPRING_DATASOURCE_USERNAME:school}
    password: ${SPRING_DATASOURCE_PASSWORD:school_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 4

server:
  port: 8097

dashboard-query:
  internal-api:
    token: ${DASHBOARD_QUERY_INTERNAL_TOKEN:}
