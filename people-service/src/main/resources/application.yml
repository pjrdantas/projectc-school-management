spring:
  application:
    name: people-service

server:
  port: 8093

management:
  endpoints:
    web:
      exposure:
        include: health,info

people:
  shadow:
    internal-api:
      token: ${PEOPLE_SHADOW_INTERNAL_API_TOKEN:people-shadow-local-token}
    monolith:
      base-url: ${PEOPLE_SHADOW_MONOLITH_BASE_URL:http://localhost:8080}
      connect-timeout: ${PEOPLE_SHADOW_MONOLITH_CONNECT_TIMEOUT:2s}
      read-timeout: ${PEOPLE_SHADOW_MONOLITH_READ_TIMEOUT:5s}
      address-write-adapter-enabled: ${PEOPLE_SHADOW_MONOLITH_ADDRESS_WRITE_ADAPTER_ENABLED:false}
    local-persistence:
      enabled: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_ENABLED:false}
      migration-enabled: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_MIGRATION_ENABLED:false}
      read-model-cutover-enabled: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_READ_MODEL_CUTOVER_ENABLED:false}
      fail-on-error: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_FAIL_ON_ERROR:false}
      backfill-enabled: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_BACKFILL_ENABLED:false}
      reconciliation-enabled: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_RECONCILIATION_ENABLED:false}
      backfill-batch-size: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_BACKFILL_BATCH_SIZE:500}
      read-model-fallback-enabled: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_READ_MODEL_FALLBACK_ENABLED:true}
      schema-migration:
        url: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_SCHEMA_URL:}
        username: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_SCHEMA_USERNAME:}
        password: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_SCHEMA_PASSWORD:}
        driver-class-name: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_SCHEMA_DRIVER_CLASS_NAME:}
        locations: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_SCHEMA_LOCATIONS:classpath:db/people-readmodel/migration}
      catalog-backfill:
        source-url: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_CATALOG_BACKFILL_SOURCE_URL:}
        source-username: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_CATALOG_BACKFILL_SOURCE_USERNAME:}
        source-password: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_CATALOG_BACKFILL_SOURCE_PASSWORD:}
        source-driver-class-name: ${PEOPLE_SHADOW_LOCAL_PERSISTENCE_CATALOG_BACKFILL_SOURCE_DRIVER_CLASS_NAME:}
