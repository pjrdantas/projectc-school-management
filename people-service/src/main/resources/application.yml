spring:
  application:
    name: people-service

server:
  port: 8093

management:
  endpoints:
    web:
      exposure:
        include: health,info

people:
  internal-api:
    token: ${PEOPLE_INTERNAL_API_TOKEN:people-internal-local-token}
  read-model:
    enabled: ${PEOPLE_READ_MODEL_ENABLED:true}
    migration-enabled: ${PEOPLE_READ_MODEL_MIGRATION_ENABLED:true}
    local-read-routing-enabled: ${PEOPLE_READ_MODEL_LOCAL_READ_ROUTING_ENABLED:true}
    fail-on-error: ${PEOPLE_READ_MODEL_FAIL_ON_ERROR:true}
    backfill-enabled: false
    reconciliation-enabled: false
    backfill-batch-size: ${PEOPLE_READ_MODEL_BACKFILL_BATCH_SIZE:500}
    fallback-enabled: false
    schema-migration:
      url: ${PEOPLE_READ_MODEL_SCHEMA_URL:jdbc:postgresql://localhost:5433/people}
      username: ${PEOPLE_READ_MODEL_SCHEMA_USERNAME:school}
      password: ${PEOPLE_READ_MODEL_SCHEMA_PASSWORD:school_local}
      driver-class-name: ${PEOPLE_READ_MODEL_SCHEMA_DRIVER_CLASS_NAME:org.postgresql.Driver}
      locations: ${PEOPLE_READ_MODEL_SCHEMA_LOCATIONS:classpath:db/people-readmodel/migration}

