spring:
  application:
    name: people-service

server:
  port: 8093

management:
  endpoints:
    web:
      exposure:
        include: health,info

people:
  internal-api:
    token: ${PEOPLE_INTERNAL_API_TOKEN:people-internal-local-token}
  school-catalog:
    base-url: ${PEOPLE_SCHOOL_CATALOG_BASE_URL:http://localhost:8092}
    internal-token: ${PEOPLE_SCHOOL_CATALOG_INTERNAL_TOKEN:}
    connect-timeout: ${PEOPLE_SCHOOL_CATALOG_CONNECT_TIMEOUT:2s}
    read-timeout: ${PEOPLE_SCHOOL_CATALOG_READ_TIMEOUT:5s}
  student-responsibles:
    base-url: ${PEOPLE_STUDENT_RESPONSIBLES_BASE_URL:http://localhost:8095}
    internal-token: ${PEOPLE_STUDENT_RESPONSIBLES_INTERNAL_TOKEN:}
    connect-timeout: ${PEOPLE_STUDENT_RESPONSIBLES_CONNECT_TIMEOUT:2s}
    read-timeout: ${PEOPLE_STUDENT_RESPONSIBLES_READ_TIMEOUT:5s}
  read-model:
    enabled: ${PEOPLE_READ_MODEL_ENABLED:true}
    migration-enabled: ${PEOPLE_READ_MODEL_MIGRATION_ENABLED:true}
    local-read-routing-enabled: ${PEOPLE_READ_MODEL_LOCAL_READ_ROUTING_ENABLED:true}
    fail-on-error: ${PEOPLE_READ_MODEL_FAIL_ON_ERROR:true}
    backfill-enabled: false
    reconciliation-enabled: false
    backfill-batch-size: ${PEOPLE_READ_MODEL_BACKFILL_BATCH_SIZE:500}
    backfill:
      enabled: ${PEOPLE_WRITE_BACKFILL_ENABLED:false}
      source-url: ${PEOPLE_WRITE_BACKFILL_SOURCE_URL:}
      source-username: ${PEOPLE_WRITE_BACKFILL_SOURCE_USERNAME:}
      source-password: ${PEOPLE_WRITE_BACKFILL_SOURCE_PASSWORD:}
      batch-size: ${PEOPLE_WRITE_BACKFILL_BATCH_SIZE:500}
      fail-on-mismatch: ${PEOPLE_WRITE_BACKFILL_FAIL_ON_MISMATCH:true}
    fallback-enabled: false
    schema-migration:
      url: ${PEOPLE_READ_MODEL_SCHEMA_URL:jdbc:postgresql://localhost:5433/people}
      username: ${PEOPLE_READ_MODEL_SCHEMA_USERNAME:school}
      password: ${PEOPLE_READ_MODEL_SCHEMA_PASSWORD:school_local}
      driver-class-name: ${PEOPLE_READ_MODEL_SCHEMA_DRIVER_CLASS_NAME:org.postgresql.Driver}
      locations: ${PEOPLE_READ_MODEL_SCHEMA_LOCATIONS:classpath:db/people-readmodel/migration}

