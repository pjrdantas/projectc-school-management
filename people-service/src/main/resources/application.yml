spring:
  application:
    name: people-service
  flyway:
    enabled: true
    locations: classpath:db/people/migration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/people}
    username: ${SPRING_DATASOURCE_USERNAME:school}
    password: ${SPRING_DATASOURCE_PASSWORD:school_local}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

server:
  port: 8093

management:
  endpoints:
    web:
      exposure:
        include: health,info

people:
  internal-api:
    token: ${PEOPLE_INTERNAL_API_TOKEN:people-internal-local-token}
  school-catalog:
    base-url: ${PEOPLE_SCHOOL_CATALOG_BASE_URL:http://localhost:8092}
    internal-token: ${PEOPLE_SCHOOL_CATALOG_INTERNAL_TOKEN:}
    connect-timeout: ${PEOPLE_SCHOOL_CATALOG_CONNECT_TIMEOUT:2s}
    read-timeout: ${PEOPLE_SCHOOL_CATALOG_READ_TIMEOUT:5s}
  student-responsibles:
    base-url: ${PEOPLE_STUDENT_RESPONSIBLES_BASE_URL:http://localhost:8095}
    internal-token: ${PEOPLE_STUDENT_RESPONSIBLES_INTERNAL_TOKEN:}
    connect-timeout: ${PEOPLE_STUDENT_RESPONSIBLES_CONNECT_TIMEOUT:2s}
    read-timeout: ${PEOPLE_STUDENT_RESPONSIBLES_READ_TIMEOUT:5s}
  persistence:
    enabled: ${PEOPLE_PERSISTENCE_ENABLED:true}
    local-read-routing-enabled: ${PEOPLE_PERSISTENCE_LOCAL_ROUTING_ENABLED:true}
    fallback-enabled: false

