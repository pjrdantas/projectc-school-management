spring:
  application:
    name: enrollment-document-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/enrollment_document}
    username: ${SPRING_DATASOURCE_USERNAME:school}
    password: ${SPRING_DATASOURCE_PASSWORD:school_local}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8094

management:
  endpoints:
    web:
      exposure:
        include: health,info

enrollment-document:
  document-storage:
    root-directory: ${ENROLLMENT_DOCUMENT_STORAGE_ROOT:}
  internal-api:
    token: ${ENROLLMENT_DOCUMENT_INTERNAL_API_TOKEN:enrollment-document-internal-local-token}
  matricula-aluno:
    base-url: ${ENROLLMENT_DOCUMENT_MATRICULA_ALUNO_BASE_URL:http://localhost:8083}
    internal-token: ${ENROLLMENT_DOCUMENT_MATRICULA_ALUNO_INTERNAL_TOKEN:people-local-token}
    connect-timeout: ${ENROLLMENT_DOCUMENT_MATRICULA_ALUNO_CONNECT_TIMEOUT:2s}
    read-timeout: ${ENROLLMENT_DOCUMENT_MATRICULA_ALUNO_READ_TIMEOUT:5s}
  matricula-catalogo-academico:
    base-url: ${ENROLLMENT_DOCUMENT_MATRICULA_CATALOGO_ACADEMICO_BASE_URL:http://localhost:8082}
    internal-token: ${ENROLLMENT_DOCUMENT_MATRICULA_CATALOGO_ACADEMICO_INTERNAL_TOKEN:catalog-local-token}
    connect-timeout: ${ENROLLMENT_DOCUMENT_MATRICULA_CATALOGO_ACADEMICO_CONNECT_TIMEOUT:2s}
    read-timeout: ${ENROLLMENT_DOCUMENT_MATRICULA_CATALOGO_ACADEMICO_READ_TIMEOUT:5s}
