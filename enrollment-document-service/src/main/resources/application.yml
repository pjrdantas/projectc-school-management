spring:
  application:
    name: enrollment-document-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:enrollment_document_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8094

management:
  endpoints:
    web:
      exposure:
        include: health,info

enrollment-document:
  internal-api:
    token: ${ENROLLMENT_DOCUMENT_INTERNAL_API_TOKEN:enrollment-document-internal-local-token}
