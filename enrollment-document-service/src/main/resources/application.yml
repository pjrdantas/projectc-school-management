spring:
  application:
    name: enrollment-document-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:enrollment_document_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8094

management:
  endpoints:
    web:
      exposure:
        include: health,info

enrollment-document:
  document-storage:
    root-directory: ${ENROLLMENT_DOCUMENT_STORAGE_ROOT:}
  document-backfill:
    enabled: ${ENROLLMENT_DOCUMENT_BACKFILL_ENABLED:false}
    source-url: ${ENROLLMENT_DOCUMENT_BACKFILL_SOURCE_URL:}
    source-username: ${ENROLLMENT_DOCUMENT_BACKFILL_SOURCE_USERNAME:}
    source-password: ${ENROLLMENT_DOCUMENT_BACKFILL_SOURCE_PASSWORD:}
    source-storage-root: ${ENROLLMENT_DOCUMENT_BACKFILL_SOURCE_STORAGE_ROOT:}
    batch-size: ${ENROLLMENT_DOCUMENT_BACKFILL_BATCH_SIZE:500}
    fail-on-mismatch: ${ENROLLMENT_DOCUMENT_BACKFILL_FAIL_ON_MISMATCH:true}
  internal-api:
    token: ${ENROLLMENT_DOCUMENT_INTERNAL_API_TOKEN:enrollment-document-internal-local-token}
  matricula-aluno:
    base-url: ${ENROLLMENT_DOCUMENT_MATRICULA_ALUNO_BASE_URL:http://localhost:8093}
    internal-token: ${ENROLLMENT_DOCUMENT_MATRICULA_ALUNO_INTERNAL_TOKEN:}
    connect-timeout: ${ENROLLMENT_DOCUMENT_MATRICULA_ALUNO_CONNECT_TIMEOUT:2s}
    read-timeout: ${ENROLLMENT_DOCUMENT_MATRICULA_ALUNO_READ_TIMEOUT:5s}
  matricula-catalogo-academico:
    base-url: ${ENROLLMENT_DOCUMENT_MATRICULA_CATALOGO_ACADEMICO_BASE_URL:http://localhost:8092}
    internal-token: ${ENROLLMENT_DOCUMENT_MATRICULA_CATALOGO_ACADEMICO_INTERNAL_TOKEN:}
    connect-timeout: ${ENROLLMENT_DOCUMENT_MATRICULA_CATALOGO_ACADEMICO_CONNECT_TIMEOUT:2s}
    read-timeout: ${ENROLLMENT_DOCUMENT_MATRICULA_CATALOGO_ACADEMICO_READ_TIMEOUT:5s}
  persistence:
    backfill:
      enabled: ${ENROLLMENT_DOCUMENT_WRITE_BACKFILL_ENABLED:false}
      source-url: ${ENROLLMENT_DOCUMENT_WRITE_BACKFILL_SOURCE_URL:}
      source-username: ${ENROLLMENT_DOCUMENT_WRITE_BACKFILL_SOURCE_USERNAME:}
      source-password: ${ENROLLMENT_DOCUMENT_WRITE_BACKFILL_SOURCE_PASSWORD:}
      batch-size: ${ENROLLMENT_DOCUMENT_WRITE_BACKFILL_BATCH_SIZE:500}
      fail-on-mismatch: ${ENROLLMENT_DOCUMENT_WRITE_BACKFILL_FAIL_ON_MISMATCH:true}
