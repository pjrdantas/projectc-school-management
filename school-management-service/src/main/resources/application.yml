# ======================================================
# CONFIG GLOBAL
# ======================================================
auth:
  jwt:
    secret: ${JWT_SECRET:q3X5k9ZL8mY2P0vQ7nT4sR6uW1xA9bC3dE5fG7hJkL0=}
    expirationMs: 3600000
    refreshExpirationMs: 604800000

server:
  port: 8080

logging:
  level:
    "[org.hibernate.SQL]": ERROR
    "[org.hibernate.orm.jdbc.bind]": ERROR

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    show-sql: false
    properties:
      hibernate:
        "[show_sql]": false
        "[format_sql]": false
        "[highlight_sql]": false

# ACTUATOR (ESSENCIAL PRO K8s)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
# ======================================================
# DEV — ORACLE LOCAL
# ======================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: ROOT
    password: root123
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update

---
# ======================================================
# DOCKER — ORACLE HOST
# ======================================================
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@host.docker.internal:1521/XEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:ROOT}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update

---
# ======================================================
# PROD — AWS (POSTGRES)
# ======================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db-projeto-piloto.cg90g0iomqah.us-east-1.rds.amazonaws.com:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate