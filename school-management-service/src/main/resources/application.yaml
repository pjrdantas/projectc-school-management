spring:
  application:
    name: school-management-service

  profiles:
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school_management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:bWluaGEtY2hhdmUtc3VwZXItc2VjcmV0YQ==}
    expiration-ms: ${AUTH_JWT_EXPIRATION_MS:1800000}
    refresh-expiration-ms: ${AUTH_JWT_REFRESH_EXPIRATION_MS:604800000}
