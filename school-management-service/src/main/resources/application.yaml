spring:
  application:
    name: school-management-service

  profiles:
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestao_escolar}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:0}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    expiration-ms: ${AUTH_JWT_EXPIRATION_MS:1800000}
    refresh-expiration-ms: ${AUTH_JWT_REFRESH_EXPIRATION_MS:604800000}

dashboard:
  alertas:
    limite-padrao: ${DASHBOARD_ALERTAS_LIMITE_PADRAO:0}
  frontend:
    historico-dias: ${DASHBOARD_FRONTEND_HISTORICO_DIAS:30}
  snapshots:
    scheduler:
      enabled: ${DASHBOARD_SNAPSHOTS_SCHEDULER_ENABLED:true}
      cron: ${DASHBOARD_SNAPSHOTS_SCHEDULER_CRON:0 15 1 * * *}
      zone: ${DASHBOARD_SNAPSHOTS_SCHEDULER_ZONE:America/Sao_Paulo}
      publicos: ${DASHBOARD_SNAPSHOTS_SCHEDULER_PUBLICOS:ACADEMICO,SECRETARIA,DIRETOR}

professor:
  internal-client:
    enabled: ${PROFESSOR_INTERNAL_CLIENT_ENABLED:false}
    fallback-local-on-error: ${PROFESSOR_INTERNAL_CLIENT_FALLBACK_LOCAL_ON_ERROR:true}
    base-url: ${PROFESSOR_INTERNAL_CLIENT_BASE_URL:http://localhost:8080}
    internal-token: ${PROFESSOR_INTERNAL_CLIENT_INTERNAL_TOKEN:}

documento:
  storage:
    backend: ${DOCUMENTO_STORAGE_BACKEND:local}
    local:
      root: ${DOCUMENTO_STORAGE_LOCAL_ROOT:uploads/documentos}
    s3:
      bucket: ${DOCUMENTO_STORAGE_S3_BUCKET:school-documents}
      prefix: ${DOCUMENTO_STORAGE_S3_PREFIX:documentos}
      region: ${DOCUMENTO_STORAGE_S3_REGION:us-east-1}
      endpoint: ${DOCUMENTO_STORAGE_S3_ENDPOINT:}
      access-key: ${DOCUMENTO_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${DOCUMENTO_STORAGE_S3_SECRET_KEY:}
      path-style-access: ${DOCUMENTO_STORAGE_S3_PATH_STYLE_ACCESS:true}
