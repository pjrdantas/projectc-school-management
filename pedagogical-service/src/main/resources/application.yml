spring:
  application:
    name: pedagogical-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pedagogical}
    username: ${SPRING_DATASOURCE_USERNAME:school}
    password: ${SPRING_DATASOURCE_PASSWORD:school_local}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8095

management:
  endpoints:
    web:
      exposure:
        include: health,info

pedagogical:
  internal-api:
    token: ${PEDAGOGICAL_INTERNAL_API_TOKEN:pedagogical-internal-local-token}
