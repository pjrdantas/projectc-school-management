spring:
  application:
    name: pedagogical-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:pedagogical_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8095

management:
  endpoints:
    web:
      exposure:
        include: health,info

pedagogical:
  internal-api:
    token: ${PEDAGOGICAL_INTERNAL_API_TOKEN:pedagogical-internal-local-token}
  persistence:
    backfill:
      enabled: ${PEDAGOGICAL_BACKFILL_ENABLED:false}
      source-url: ${PEDAGOGICAL_BACKFILL_SOURCE_URL:}
      source-username: ${PEDAGOGICAL_BACKFILL_SOURCE_USERNAME:}
      source-password: ${PEDAGOGICAL_BACKFILL_SOURCE_PASSWORD:}
      school-id: ${PEDAGOGICAL_BACKFILL_SCHOOL_ID:}
      batch-size: ${PEDAGOGICAL_BACKFILL_BATCH_SIZE:500}
      fail-on-mismatch: ${PEDAGOGICAL_BACKFILL_FAIL_ON_MISMATCH:true}
