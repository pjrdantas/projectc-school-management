spring:
  application:
    name: academic-catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/academic_catalog}
    username: ${SPRING_DATASOURCE_USERNAME:school}
    password: ${SPRING_DATASOURCE_PASSWORD:school_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

catalog:
  internal-api:
    token: ${CATALOG_INTERNAL_API_TOKEN:}
  outbox:
    publisher:
      enabled: ${CATALOG_OUTBOX_PUBLISHER_ENABLED:false}
      topic: ${CATALOG_EVENTS_TOPIC:school.catalog.events.v1}
      dlt-topic: ${CATALOG_EVENTS_DLT_TOPIC:school.catalog.events.v1.DLT}
      partitions: ${CATALOG_EVENTS_PARTITIONS:3}
      batch-size: ${CATALOG_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${CATALOG_OUTBOX_MAX_ATTEMPTS:5}
      fixed-delay: ${CATALOG_OUTBOX_FIXED_DELAY:PT2S}
      lock-timeout: ${CATALOG_OUTBOX_LOCK_TIMEOUT:PT1M}
      initial-backoff: ${CATALOG_OUTBOX_INITIAL_BACKOFF:PT5S}
      max-backoff: ${CATALOG_OUTBOX_MAX_BACKOFF:PT5M}
      send-timeout: ${CATALOG_OUTBOX_SEND_TIMEOUT:PT10S}
  cache:
    enabled: ${CATALOG_CACHE_ENABLED:false}
    environment: ${DEPLOYMENT_ENVIRONMENT:local}
    ttl: ${CATALOG_CACHE_TTL:PT5M}
    kafka:
      enabled: ${CATALOG_CACHE_KAFKA_ENABLED:true}
      group-id: ${CATALOG_CACHE_KAFKA_GROUP_ID:academic-catalog-cache-v1}
