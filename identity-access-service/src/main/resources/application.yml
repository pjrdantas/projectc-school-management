server:
  port: 8091

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestao_escolar}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

identity-access:
  internal-api:
    token: ${IDENTITY_ACCESS_INTERNAL_TOKEN:}
  monolith:
    base-url: ${IDENTITY_ACCESS_MONOLITH_BASE_URL:http://localhost:8080}
    connect-timeout: 2s
    read-timeout: 5s
