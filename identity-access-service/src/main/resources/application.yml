server:
  port: 8091

spring:
  flyway:
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestao_escolar}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

identity-access:
  internal-api:
    token: ${IDENTITY_ACCESS_INTERNAL_TOKEN:}
  school-session:
    base-url: ${IDENTITY_ACCESS_SCHOOL_SESSION_BASE_URL:http://localhost:8092}
    internal-token: ${IDENTITY_ACCESS_SCHOOL_SESSION_INTERNAL_TOKEN:}
    connect-timeout: ${IDENTITY_ACCESS_SCHOOL_SESSION_CONNECT_TIMEOUT:2s}
    read-timeout: ${IDENTITY_ACCESS_SCHOOL_SESSION_READ_TIMEOUT:5s}
  session-cleanup:
    enabled: ${IDENTITY_ACCESS_SESSION_CLEANUP_ENABLED:true}
    fixed-delay: ${IDENTITY_ACCESS_SESSION_CLEANUP_FIXED_DELAY:24h}
  persistence:
    schema-migration:
      enabled: ${IDENTITY_ACCESS_SCHEMA_MIGRATION_ENABLED:false}
      url: ${IDENTITY_ACCESS_SCHEMA_URL:jdbc:postgresql://localhost:5432/identity_access}
      username: ${IDENTITY_ACCESS_SCHEMA_USERNAME:postgres}
      password: ${IDENTITY_ACCESS_SCHEMA_PASSWORD:postgres}
      locations: ${IDENTITY_ACCESS_SCHEMA_LOCATIONS:classpath:db/identity-access/migration}
    backfill:
      enabled: ${IDENTITY_ACCESS_BACKFILL_ENABLED:false}
      source-url: ${IDENTITY_ACCESS_BACKFILL_SOURCE_URL:jdbc:postgresql://localhost:5432/gestao_escolar}
      source-username: ${IDENTITY_ACCESS_BACKFILL_SOURCE_USERNAME:postgres}
      source-password: ${IDENTITY_ACCESS_BACKFILL_SOURCE_PASSWORD:postgres}
      batch-size: ${IDENTITY_ACCESS_BACKFILL_BATCH_SIZE:500}
      fail-on-mismatch: ${IDENTITY_ACCESS_BACKFILL_FAIL_ON_MISMATCH:true}
