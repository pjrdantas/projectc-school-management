server:
  port: 8091

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestao_escolar}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

identity-access:
  internal-api:
    token: ${IDENTITY_ACCESS_INTERNAL_TOKEN:}
  session-cleanup:
    enabled: ${IDENTITY_ACCESS_SESSION_CLEANUP_ENABLED:true}
    fixed-delay: ${IDENTITY_ACCESS_SESSION_CLEANUP_FIXED_DELAY:24h}
