server:
  port: 8091

spring:
  application:
    name: identity-access-service
  flyway:
    enabled: true
    locations: classpath:db/identity-access/migration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/identity_access}
    username: ${SPRING_DATASOURCE_USERNAME:school}
    password: ${SPRING_DATASOURCE_PASSWORD:school_local}

identity-access:
  internal-api:
    token: ${IDENTITY_ACCESS_INTERNAL_TOKEN:}
  school-session:
    base-url: ${IDENTITY_ACCESS_SCHOOL_SESSION_BASE_URL:http://localhost:8092}
    internal-token: ${IDENTITY_ACCESS_SCHOOL_SESSION_INTERNAL_TOKEN:}
    connect-timeout: ${IDENTITY_ACCESS_SCHOOL_SESSION_CONNECT_TIMEOUT:2s}
    read-timeout: ${IDENTITY_ACCESS_SCHOOL_SESSION_READ_TIMEOUT:5s}
  session-cleanup:
    enabled: ${IDENTITY_ACCESS_SESSION_CLEANUP_ENABLED:true}
    fixed-delay: ${IDENTITY_ACCESS_SESSION_CLEANUP_FIXED_DELAY:24h}
